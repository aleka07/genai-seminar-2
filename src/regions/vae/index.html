        <figure class="fig vae-fig" id="vae-fig" style="margin:0">
          <div class="vae-hintrow"><span class="vae-hint mono" id="vae-dg-hint"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2 L3 12.5 L5.9 9.9 L8 14.2 L9.9 13.3 L7.8 9.1 L11.6 9 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span class="h-hover">наведи на блок схемы</span><span class="h-touch">нажми на блок схемы</span></span></div>
          <svg class="vae-dg" id="vae-dg" viewBox="0 0 640 330" role="group" aria-label="Схема VAE: x, энкодер, μ и σ, шум ε, латентный вектор z, декодер, реконструкция x с крышкой. Каждый блок можно выбрать, пояснение появится под схемой.">

            </div>
            <div class="vae-cvs">
              <div class="vae-pane">

                <p class="vae-leg"><span><i class="lg-dot"></i>μ(x) данных</span><span><i class="lg-fill"></i>q(z)</span><span><i class="lg-hatch"></i>дыры</span><span><i class="lg-z"></i>z ~ 𝒩(0, I)</span></p>

              <div class="vae-pane">
                <div class="vae-pl"><span class="mono">пространство данных</span><span class="vae-math">x ∈ ℝ²</span></div>
                <canvas id="vae-dat" role="img" aria-label="Пространство данных: серый Swiss roll — данные, синее облако — выход гауссова декодера для текущего z."></canvas>
                <p class="vae-leg"><span><i class="lg-roll"></i><em>p<sub>data</sub></em></span><span><i class="lg-cloud"></i><em>p<sub>θ</sub>(x|z)</em></span><span><i class="lg-ring"></i>из дыры</span></p>
              </div>
            </div>
            <p class="vae-read" id="vae-read" aria-live="polite">z = (0.42, −1.10) → u = 0.66</p>

            <div class="vae-ctl">
              <div class="vae-beta">
                <label for="vae-beta" class="mono">вес KL, <span class="vae-math">β</span></label>
                <output id="vae-beta-out" for="vae-beta" class="vae-math">β = 1.00</output>
                <input type="range" id="vae-beta" min="0" max="1000" step="1" value="624" aria-valuetext="β = 1.00">
                <div class="vae-ticks" aria-hidden="true"><span style="--p:0">0.1</span><span style="--p:.624">1 · обычный VAE</span><span style="--p:1">4</span></div>
              </div>
              <button type="button" class="vae-btn" id="vae-sample"><svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="2 2.4"/><circle cx="7" cy="8" r="1.4" fill="currentColor"/><circle cx="11" cy="10.5" r="1.4" fill="currentColor"/><circle cx="10" cy="6" r="1.1" fill="currentColor"/></svg>Сэмплировать из <span class="vae-math">𝒩(0, I)</span></button>
            </div>

            <div class="vae-meters">
              <div class="vae-m"><span class="vae-m-l">z из 𝒩(0, I) в дырах</span><span class="vae-bar"><i id="vae-m-hole"></i></span><b id="vae-m-hole-v">0%</b></div>
              <div class="vae-m"><span class="vae-m-l">размытие: σ декодера</span><span class="vae-bar"><i id="vae-m-blur"></i></span><b id="vae-m-blur-v">0.06</b></div>
            </div>
            <p class="vae-verdict" id="vae-verdict" aria-live="polite">Закодированные данные заполняют 𝒩(0, I) почти без дыр, и случайное z декодируется в правдоподобную точку. Веди z вдоль оси z<sub>1</sub>: x̂ плавно скользит по роллу, отсюда гладкая интерполяция. Цена — облака декодера уже заметно размыты.</p>
          </div>
          <figcaption class="cap">Энкодер выдаёт не точку, а распределение: среднее μ и разброс σ. Для генерации энкодер не нужен: берём z из 𝒩(0, I) и пропускаем через декодер. Ползунок — множитель β перед KL, как в β-VAE<a class="cite" href="#ref-13">[13]</a>; β = 1 — обычный VAE. Модель игрушечная: энкодер задан формулой, декодер — лучшее усреднение данных для такого энкодера.</figcaption>
        </figure>
